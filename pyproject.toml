[project]
name = "aws_data"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.20",
    "dagster-aws",
    "dagster-delta[polars]>=0.5.9",
    "dagster-k8s>=0.29.20",
    "dagster-postgres>=0.29.20",
    "pytest-cov>=7.1.0",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.pytest.ini_options]
addopts = "--cov=aws_data"
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
# Experiment notebooks (marimo) aren't linted or reformatted, even when an
# editor passes the file explicitly.
extend-exclude = ["*.nb.py"]
force-exclude = true

[tool.ruff.lint.isort]
known-first-party = ["aws_data"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "aws_data"
registry_modules = [
    "aws_data.components.*",
]


